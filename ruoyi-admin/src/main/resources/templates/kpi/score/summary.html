<!-- 这是考核结果页面 -->
<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head th:include="include :: header('考核结果汇总')"></head>

<body class="gray-bg">
    <div class="wrapper wrapper-content animated fadeInRight">
        <div class="row">
            <div class="col-sm-12">
                <div class="ibox">
                    <div class="ibox-title">
                        <h5>考核结果汇总</h5>
                    </div>
                    <div class="ibox-content">
                        <div class="form-horizontal">
                            <div class="form-group">
                                <label class="col-sm-1 control-label">开始：</label>
                                <div class="col-sm-2">
                                    <input type="month" id="startMonth" class="form-control" />
                                </div>
                                <label class="col-sm-1 control-label">结束：</label>
                                <div class="col-sm-2">
                                    <input type="month" id="endMonth" class="form-control" />
                                </div>
                                <label class="col-sm-1 control-label">部门：</label>
                                <div class="col-sm-2">
                                    <select id="deptSelect" class="form-control">
                                        <option value="">全部部门</option>
                                        <option th:each="dept : ${depts}" th:value="${dept.deptId}"
                                            th:text="${dept.deptName}"></option>
                                    </select>
                                </div>
                                <label class="col-sm-1 control-label">岗位：</label>
                                <div class="col-sm-2">
                                    <select id="postSelect" class="form-control">
                                        <option value="">全部岗位</option>
                                        <option th:each="post : ${posts}" th:value="${post.postId}"
                                            th:text="${post.postName}"></option>
                                    </select>
                                </div>
                                <div class="col-sm-2" style="display: flex; gap: 50px;">
                                    <button type="button" class="btn btn-primary" onclick="search()">
                                        <i class="fa fa-search"></i> 查询
                                    </button>
                                    <button type="button" class="btn btn-success" onclick="exportExcel()">
                                        <i class="fa fa-file-excel-o"></i> 导出Excel
                                    </button>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <table id="summaryTable" class="table table-bordered table-hover" style="display:none;">
                                    <thead>
                                        <tr>
                                            <th>排名</th>
                                            <th>被考核人</th>
                                            <th>部门</th>
                                            <th>总分</th>
                                            <th>参与月数</th>
                                        </tr>
                                    </thead>
                                    <tbody id="summaryBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:include="include :: footer"></div>
        <script th:inline="javascript">
            var isAdmin = /*[[${isAdmin}]]*/ true;
            var currentDeptId = /*[[${currentDeptId}]]*/ null;
            var currentDeptName = /*[[${currentDeptName}]]*/ '';
            var ctx = [[@{/}]];

            // 初始化月份和部门
            $(function () {
                // 设置当月
                var now = new Date();
                var month = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2);
                $("#startMonth").val(month);
                $("#endMonth").val(month);
                if (!isAdmin && currentDeptName && currentDeptName !== '') {
                    $("#deptSelect").hide();
                    $("#deptSelect").prev("label").hide();
                    $("#deptSelect").after('<span class="form-control-static" style="margin-left:10px;font-weight:bold;padding-top:7px;display:inline-block;">' + currentDeptName + '</span>');
                }
                // 页面打开时自动加载
                search();
                // 仅岗位下拉框改变时自动刷新
                $("#startMonth,#endMonth,#deptSelect,#postSelect").on('change', function () {
                    search();
                });
            });

            function showDetail(userId, userName, startMonth, endMonth) {
                if (!startMonth || !endMonth) {
                    alert("月份参数错误");
                    return;
                }

                $.get(ctx + "kpi/score/personDetail", {
                    startMonth: startMonth,
                    endMonth: endMonth,
                    userId: userId
                }, function (res) {
                    if (res.code != 0) { alert("加载详情失败"); return; }
                    var details = res.data;

                    // 按分数降序排列
                    details.sort(function (a, b) {
                        return b.score - a.score;
                    });

                    var content = '<table class="table table-bordered table-striped">';
                    content += '<thead><tr><th>月份</th><th>考核项目</th><th>得分</th><th>备注</th></tr></thead><tbody>';
                    if (details.length === 0) {
                        content += '<tr><td colspan="4" class="text-center">该区间无考核记录</td></tr>';
                    } else {
                        for (var i = 0; i < details.length; i++) {
                            var d = details[i];
                            content += '<tr>';
                            content += '<td>' + (d.batchNo || '') + '</td>';
                            content += '<td>' + d.itemName + '</td>';
                            content += '<td style="color:' + (d.score >= 0 ? 'green' : 'red') + '">' + (d.score >= 0 ? '+' : '') + d.score + '</td>';
                            content += '<td>' + (d.remark || '') + '</td>';
                            content += '</tr>';
                        }
                    }
                    content += '</tbody></table>';

                    layer.open({
                        type: 1,
                        title: userName + ' - 考核详情（' + startMonth + ' 至 ' + endMonth + '）',
                        shadeClose: true,
                        area: ['750px', '450px'],
                        content: '<div style="padding:15px;">' + content + '</div>'
                    });
                });
            }

            function search() {
                var startMonth = document.getElementById("startMonth").value;
                var endMonth = document.getElementById("endMonth").value;
                var deptIdEl;
                var postId;
                if (!isAdmin) {
                    // 普通用户：强制使用自己的部门ID
                    deptIdEl = currentDeptId;
                } else {
                    // 管理员：从下拉框获取
                    deptIdEl = document.getElementById("deptSelect").value;
                }
                postId = document.getElementById("postSelect").value;

                var deptId = deptIdEl.value;

                if (!startMonth || !endMonth) {
                    alert("请选择开始和结束月份");
                    return;
                }

                // var url = ctx + "kpi/score/summary/data?batchNo=" + encodeURIComponent(batchNo);
                var url = ctx + "kpi/score/summary/avg?startMonth=" + encodeURIComponent(startMonth) +
                    "&endMonth=" + encodeURIComponent(endMonth);
                if (deptId && deptId !== "") {
                    url += "&deptId=" + encodeURIComponent(deptId);
                }
                if (postId && postId !== "") {
                    url += "&postId=" + encodeURIComponent(postId);
                }

                fetch(url)
                    .then(response => response.json())
                    .then(res => {
                        if (res.code != 0) {
                            alert("查询失败：" + res.msg);
                            return;
                        }
                        var data = res.data;
                        var html = "";
                        for (var i = 0; i < data.length; i++) {
                            var row = data[i];
                            html += '<tr>';
                            html += '<td>' + (i + 1) + '</td>';
                            html += '<td>' + row.userName + '</td>';
                            html += '<td>' + row.deptName + '</td>';
                            html += '<td>' + (row.totalScore).toFixed(2) + '</td>';
                            html += '<td>' + row.itemCount + '</td>';
                            // 新增“详细”按钮列
                            html += '<td><button class="btn btn-xs btn-info" onclick="showDetail(\'' + row.userId + '\', \'' + row.userName + '\', \'' + startMonth + '\', \'' + endMonth + '\')">详细</button></td>';
                            html += '</tr>';
                        }
                        document.getElementById("summaryBody").innerHTML = html;
                        document.getElementById("summaryTable").style.display = "";
                    })
                    .catch(err => alert("请求失败：" + err.message));
            }
            function exportExcel() {
                var deptId = document.getElementById("deptSelect").value;
                var postId = document.getElementById("postSelect").value;   // 新增：获取岗位
                if (!startMonth || !endMonth) {
                    alert("请选择开始和结束月份");
                    return;
                }
                var url = ctx + "kpi/score/summary/export?startMonth=" + encodeURIComponent(startMonth) +
                    "&endMonth=" + encodeURIComponent(endMonth);
                if (deptId) {
                    url += "&deptId=" + encodeURIComponent(deptId);
                }
                if (postId) {
                    url += "&postId=" + encodeURIComponent(postId);
                }
                window.location.href = url;
            }

            $(function () {
                var now = new Date();
                var currentMonth = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2);

                $("#endMonth").val(currentMonth);
                $("#startMonth").val(currentMonth);
                search(); // 自动加载
            });
        </script>
</body>

</html>
