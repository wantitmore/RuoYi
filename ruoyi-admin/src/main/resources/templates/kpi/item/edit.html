<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:include="include :: header('修改考核项目')" />
</head>

<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-item-edit" th:object="${kpiItem}">
            <input th:field="*{id}" type="hidden">
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">考核项目名称：</label>
                    <div class="col-sm-8">
                        <input name="name" th:field="*{name}" class="form-control" type="text" required>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">满分：</label>
                    <div class="col-sm-8">
                        <input name="maxScore" th:field="*{maxScore}" class="form-control" type="text" required>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">备注：</label>
                    <div class="col-sm-8">
                        <textarea name="remark" class="form-control">[[*{remark}]]</textarea>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">所属部门：</label>
                <div class="col-sm-8">
                    <!-- 普通管理员：隐藏域+只读文本框 -->
                    <th:block th:if="${deptDisabled}">
                        <input type="hidden" name="deptId" th:value="${kpiItem.deptId}">
                        <input type="text" class="form-control" th:value="${deptName}" readonly>
                    </th:block>
                    <!-- 超级管理员：下拉选择框，回显选中 -->
                    <th:block th:unless="${deptDisabled}">
                        <select name="deptId" class="form-control" required>
                            <option value="">请选择部门</option>
                            <option th:each="dept : ${depts}" th:value="${dept.deptId}" th:text="${dept.deptName}"
                                th:selected="${dept.deptId == kpiItem.deptId}"></option>
                        </select>
                    </th:block>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">考核类别：</label>
                <div class="col-sm-8">
                    <select name="category" class="form-control" required>
                        <option value="">请选择类别</option>
                        <option th:each="dict : ${@dict.getType('kpi_category')}" th:value="${dict.dictValue}"
                            th:text="${dict.dictLabel}" th:selected="${kpiItem.category == dict.dictValue}"></option>
                    </select>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "kpi/item";
        $("#form-item-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-item-edit').serialize());
            }
        }
    </script>
</body>

</html>
