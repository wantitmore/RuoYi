<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head th:include="include :: header('六必查录入')">
    <link th:href="@{/css/style.css}" rel="stylesheet" />
</head>

<body class="gray-bg">
    <div class="wrapper wrapper-content animated fadeInRight">
        <div class="row">
            <div class="col-sm-12">
                <div class="ibox">
                    <div class="ibox-title">
                        <h5>值班领导六必查录入</h5>
                    </div>
                    <div class="ibox-content">
                        <div class="form-horizontal">
                            <div class="form-group">
                                <label class="col-sm-1 control-label">值班日期：</label>
                                <div class="col-sm-2">
                                    <input type="date" id="checkDate" class="form-control" />
                                </div>
                                <label class="col-sm-1 control-label">值班班次：</label>
                                <div class="col-sm-2">
                                    <select id="shift" class="form-control">
                                        <option value="">请选择班次</option>
                                        <option value="A班">A班</option>
                                        <option value="B班">B班</option>
                                        <option value="C班">C班</option>
                                        <option value="AC班">AC班</option>
                                        <option value="BC班">BC班</option>
                                    </select>
                                </div>
                                <label class="col-sm-1 control-label">值班领导：</label>
                                <div class="col-sm-2">
                                    <input type="text" id="dutyLeader" class="form-control" required
                                        th:value="${currentUserName}" th:attr="data-default=${currentUserName}" />
                                </div>
                                <div class="col-sm-2">
                                    <button class="btn btn-primary" onclick="loadData()">
                                        <i class="fa fa-search"></i> 加载/刷新
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="table-responsive" style="display:none;" id="tableWrapper">
                            <table class="table table-bordered">
                                <thead>
                                    <tr>
                                        <th style="width: 30px;">序号</th>
                                        <th style="width: 20%;">检查项目</th>
                                        <th style="width: 70%;">记录内容</th>
                                        <th style="width: 80px;">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody"></tbody>
                            </table>
                            <div class="text-center" style="margin-top:20px;">
                                <button class="btn btn-success" id="saveBtn" onclick="saveData()" style="display:none;">
                                    <i class="fa fa-save"></i> 保存
                                </button>
                            </div>
                        </div>
                        <!-- 关联扣分弹窗 -->

                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:include="include :: footer"></div>
    <script th:inline="javascript">
        var ctx = [[@{/}]];
        var canEdit = [[${ canEdit }]];

        $(function () {
            var now = new Date();
            var today = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2) + '-' + ('0' + now.getDate()).slice(-2);
            $("#checkDate").val(today);

            // loadData();
            $("#shift").on('change', function () {
                loadData();
            });
        });

        function loadData() {
            var checkDate = $("#checkDate").val();
            var shift = $("#shift").val();
            if (!checkDate || !shift) { alert("请选择值班日期和班次"); return; }
            $.get(ctx + "sixcheck/record/load", { checkDate: checkDate, shift: shift }, function (res) {
                if (res.code != 0) { alert("加载失败"); return; }
                var items = res.data.items;
                var records = res.data.records;
                var dutyLeader = res.data.dutyLeader || '';
                if (dutyLeader) {
                    $("#dutyLeader").val(dutyLeader);
                } else {
                    // 没有历史数据时，重置为默认值（当前登录用户名）
                    $("#dutyLeader").val($("#dutyLeader").attr("data-default") || "");
                }
                var html = '';
                var readonlyAttr = canEdit ? '' : 'readonly';
                for (var i = 0; i < items.length; i++) {
                    var item = items[i];
                    var recordValue = records[item.id] || '';
                    // 如果为空或空白，默认显示“正常”
                    if (recordValue.trim() === '') {
                        recordValue = '正常';
                    }
                    html += '<tr>';
                    html += '<td style="width: 30px;">' + (i + 1) + '</td>';
                    html += '<td style="width: 20%;">' + item.name + '</td>';
                    html += '<td><textarea class="form-control" data-item-id="' + item.id + '" rows="3">' + recordValue + '</textarea></td>';
                    // 如果当前用户有扣分权限，显示按钮
                    if (canEdit) {
                        html += '<td><button class="btn btn-xs btn-warning" onclick="openDeductModal(\'' + item.name + '\', \'' + (dutyLeader || '') + '\', \'' + item.id + '\')"><i class="fa fa-minus-circle"></i> 关联加扣分</button></td>';
                    }
                    // 检查当前输入框内容是否包含扣分信息
                    var deductPattern = /（关联加扣分-[^）]+）/g;
                    var deductMatches = recordValue.match(deductPattern);
                    if (deductMatches && deductMatches.length > 0) {
                        var lastDeduct = deductMatches[deductMatches.length - 1]; // 取最后一条扣分信息
                        html += '<td><button class="btn btn-xs btn-danger" ' +
                            'onclick="cancelDeduct(\'' + item.id + '\', \'' + lastDeduct.replace(/'/g, "\\'") + '\')" ' +
                            'title="撤销最后一条关联扣分"><i class="fa fa-undo"></i></button></td>';
                    }
                    html += '</tr>';
                }
                $("#tableBody").html(html);
                $("#tableWrapper").show();
                if (canEdit) {
                    $("#saveBtn").show();
                }
            });
        }
        function cancelDeduct(itemId, deductInfo) {
            console.log('撤销的 itemId:', itemId);
    console.log('撤销的 deductInfo:', deductInfo);
            if (!confirm("确定要撤销这条扣分吗？\n" + deductInfo)) return;

            $.ajax({
                url: ctx + "sixcheck/record/cancelDeduct",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify({
                    itemId: itemId,
                    checkDate: $("#checkDate").val(),
                    shift: $("#shift").val(),
                    deductInfo: deductInfo
                }),
                success: function (res) {
                    if (res.code == 0) {
                        alert("撤销成功");
                        loadData(); // 刷新表格
                    } else {
                        alert("操作失败：" + res.msg);
                    }
                }
            });
        }

        function saveData() {
            var checkDate = $("#checkDate").val();
            var shift = $("#shift").val();
            var dutyLeader = $("#dutyLeader").val();
            if (!checkDate || !shift) { alert("请选择值班日期和班次"); return; }
            if (!dutyLeader || dutyLeader.trim() === '') {
                alert("值班领导不能为空");
                return;
            }
            var recordList = [];
            $("#tableBody textarea").each(function () {
                var itemId = $(this).data('item-id');
                var value = $(this).val();
                if (value && value.trim() !== '') {
                    recordList.push({
                        itemId: itemId,
                        recordValue: value,
                    });
                }
            });
            if (recordList.length === 0) { alert("没有可保存的记录"); return; }
            $.ajax({
                url: ctx + "sixcheck/record/save",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify({
                    checkDate: checkDate,
                    shift: shift,
                    dutyLeader: dutyLeader,
                    recordList: recordList
                }),
                success: function (res) {
                    if (res.code == 0) alert("保存成功！");
                    else alert("保存失败：" + res.msg);
                }
            });
        }


        // 打开扣分弹窗
        function openDeductModal(checkItemName, defaultUserName, sixCheckItemId) {
            // 获取部门ID
            var deptId = [[${ currentDeptId }]]; // 确保后端已传入 currentDeptId
            if (!deptId) {
                alert("无法获取部门信息");
                return;
            }
            window._currentDeductInfo = {
                sixCheckItemId: sixCheckItemId,
                checkDate: $("#checkDate").val(),
                shift: $("#shift").val(),
                currentValue: currentValue = $("#tableBody textarea[data-item-id='" + sixCheckItemId + "']").val() || '正常'
            };

            // 同时加载用户和考核项目
            $.when(
                $.get(ctx + "kpi/score/getUsersByDept?deptId=" + deptId),
                $.get(ctx + "kpi/score/getItemsByDept?deptId=" + deptId)
            ).done(function (usersRes, itemsRes) {
                var users = usersRes[0].data || [];
                var items = itemsRes[0].data || [];

                // 渲染被考核人下拉
                var userOptions = '<option value="">请选择</option>';
                $.each(users, function (i, u) {
                    var selected = (u.userName === defaultUserName) ? ' selected' : '';
                    userOptions += '<option value="' + u.userId + '"' + selected + '>' + u.userName + '</option>';
                });

                // 提取类别
                var categories = [];
                $.each(items, function (i, item) {
                    if (item.category && categories.indexOf(item.category) === -1) {
                        categories.push(item.category);
                    }
                });
                var catOptions = '<option value="">请选择类别</option>';
                $.each(categories, function (i, cat) {
                    catOptions += '<option value="' + cat + '">' + cat + '</option>';
                });

                var contentHtml = '<div style="padding:15px;">' +
                    '<form class="form-horizontal">' +
                    '<div class="form-group"><label class="col-sm-3 control-label">被考核人：</label><div class="col-sm-8"><select id="deductUserId" class="form-control">' + userOptions + '</select></div></div>' +
                    '<div class="form-group"><label class="col-sm-3 control-label">考核类别：</label><div class="col-sm-8"><select id="deductCategory" class="form-control">' + catOptions + '</select></div></div>' +
                    '<div class="form-group"><label class="col-sm-3 control-label">考核项目：</label><div class="col-sm-8"><select id="deductItemId" class="form-control"><option value="">请先选择类别</option></select></div></div>' +
                    '<div class="form-group"><label class="col-sm-3 control-label">分数：</label><div class="col-sm-8"><input type="number" id="deductScore" class="form-control" step="0.5" min="-10" max="10" /></div></div>' +
                    '<div class="form-group"><label class="col-sm-3 control-label">备注：</label><div class="col-sm-8"><textarea id="deductRemark" class="form-control" rows="2"></textarea></div></div>' +
                    '</form></div>';

                layer.open({
                    type: 1,
                    title: '关联加扣分 - ' + checkItemName,
                    shadeClose: false,
                    shade: 0.3,
                    area: ['550px', '400px'],
                    btn: ['确定', '取消'],
                    content: contentHtml,
                    yes: function (index, layero) {
                        var userId = $(layero).find('#deductUserId').val();
                        var itemId = $(layero).find('#deductItemId').val();
                        var score = $(layero).find('#deductScore').val();
                        var remark = $(layero).find('#deductRemark').val();
                        if (!userId || !itemId || !score) {
                            alert("请填写完整信息");
                            return;
                        }
                        $.ajax({
                            url: ctx + "kpi/score/quickDeduct",
                            type: "POST",
                            contentType: "application/json",
                            data: JSON.stringify({
                                userId: userId,
                                itemId: $("#deductItemId").val(),
                                score: parseFloat(score),
                                remark: remark,
                                sixCheckItemId: window._currentDeductInfo ? window._currentDeductInfo.sixCheckItemId : null,
                                checkDate: window._currentDeductInfo ? window._currentDeductInfo.checkDate : null,
                                shift: window._currentDeductInfo ? window._currentDeductInfo.shift : null,
                                currentRecordValue: window._currentDeductInfo.currentValue
                            }),
                            success: function (res) {
                                if (res.code == 0) {
                                    alert("加扣分成功！");
                                    layer.close(index);
                                    if (res.data && res.data.finalValue) {
                                        var textarea = $('textarea[data-item-id="' + window._currentDeductInfo.sixCheckItemId + '"]');
                                        if (textarea.length > 0) {
                                            textarea.val(res.data.finalValue);
                                        }
                                    }
                                } else {
                                    alert("操作失败：" + res.msg);
                                }
                            }
                        });
                    },
                    btn2: function (index) {
                        layer.close(index);
                    },
                    success: function (layero, index) {
                        $(layero).find('#deductCategory').on('change', function () {
                            var cat = $(this).val();
                            var itemSelect = $(layero).find('#deductItemId');
                            var html = '<option value="">请选择项目</option>';
                            if (cat) {
                                $.each(items, function (i, item) {
                                    if (item.category === cat) {
                                        html += '<option value="' + item.id + '">' + item.name + ' </option>';
                                    }
                                });
                            }
                            itemSelect.html(html);
                        });
                    }
                });
            });
        }
        // 类别切换时过滤项目
        $("#deductCategory").on('change', function () {
            var cat = $(this).val();
            var html = '<option value="">请选择项目</option>';
            if (cat) {
                $.each(deptItems, function (i, item) {
                    if (item.category === cat) {
                        html += '<option value="' + item.id + '">' + item.name + '</option>';
                    }
                });
            }
            $("#deductItemId").html(html);
        });

    </script>
</body>

</html>
