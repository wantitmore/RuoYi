<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:include="include :: header('六必查月汇总')" />
</head>

<body class="gray-bg">
    <style>
        /* 月汇总表格行分割 */
        #summaryTable tbody tr {
            border-bottom: 2px solid #ccc;
            /* 加粗实线分割 */
            transition: background 0.2s;
        }

        /* #summaryTable tbody tr:last-child {
            border-bottom: none;
        } */

        #summaryTable tbody tr:hover {
            background: #f9f9f9;
            /* 鼠标悬停背景变化，增强视觉区分 */
        }

        /* 内部记录之间的分隔线（细化） */
        #summaryTable tbody td .record-item {
            border-bottom: 1px dashed #ddd;
            padding: 6px 0;
        }

        #summaryTable tbody td .record-item:last-child {
            border-bottom: none;
        }
    </style>
    <div class="wrapper wrapper-content animated fadeInRight">
        <div class="row">
            <div class="col-sm-12">
                <div class="ibox">
                    <div class="ibox-title">
                        <h5>值班领导六必查汇总</h5>
                    </div>
                    <div class="ibox-content">
                        <div class="form-horizontal">
                            <div class="form-group">
                                <!-- 月份/日期切换 -->
                                <div class="col-sm-1" style="width:80px;">
                                    <label class="control-label" style="line-height:34px;margin-top: -8px;">模式：</label>
                                </div>
                                <div class="col-sm-2" style="width:180px;">
                                    <select id="viewMode" class="form-control" onchange="toggleView()">
                                        <option value="month">月汇总</option>
                                        <option value="day">日梳理</option>
                                    </select>
                                </div>
                                <div class="col-sm-1" style="width:70px;">
                                    <label class="control-label" style="line-height:34px;margin-top: -8px;">日期：</label>
                                </div>
                                <div class="col-sm-2" id="monthInput">
                                    <input type="month" id="month" class="form-control" />
                                </div>
                                <div class="col-sm-2" id="dayInput" style="display:none;">
                                    <input type="date" id="day" class="form-control" />
                                </div>
                                <label class="col-sm-1 control-label" style="width:70px;">部1门：</label>
                                <div class="col-sm-2" id="deptInput">
                                    <select id="deptSelect" class="form-control">
                                        <!-- 注意：无“全部部门”选项 -->
                                        <option th:each="dept : ${depts}" th:value="${dept.deptId}"
                                            th:text="${dept.deptName}"></option>
                                    </select>
                                </div>
                                <div class="col-sm-2">
                                    <button class="btn btn-primary" onclick="search()">
                                        <i class="fa fa-search"></i> 查询
                                    </button>
                                </div>
                                <div class="col-sm-4" id="readStatusArea" style="display:none; margin-top:5px;">
                                    <span style="font-weight:bold; color:#5cb85c;">
                                        <i class="fa fa-book"></i> 已阅读领导：
                                    </span>
                                    <span id="readStatusContainer" style="font-weight:normal;">--</span>
                                    <button class="btn btn-xs btn-success" onclick="markAsRead()"
                                        style="margin-left:10px;">
                                        <i class="fa fa-check"></i> 标记我已读
                                    </button>
                                </div>
                            </div>
                        </div>
                        <table id="summaryTable" class="table table-bordered table-hover" style="display:none;">
                            <thead id="tableHead">
                                <tr>
                                    <th style="width: 40%;">检查项目</th>
                                    <th>记录详情</th>
                                </tr>
                            </thead>
                            <tbody id="summaryBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:include="include :: footer"></div>
    <script th:inline="javascript">
        var isAdmin = [[${ isAdmin }]];           // 从后端获取
        var currentDeptId = [[${ currentDeptId }]];
        var currentDeptName = [[${ currentDeptName }]];
        var ctx = [[@{/}]];

        $(function () {
            var now = new Date();
            var month = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2);
            var day = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2) + '-' + ('0' + now.getDate()).slice(-2);
            $("#month").val(month);
            $("#day").val(day);
            $("#viewMode").val('day');
            var deptSelect = $("#deptSelect");
            var deptSelect = $("#deptSelect");
            // 默认选中第一个部门（所有用户均如此）
            var firstOption = deptSelect.find("option:first");
            if (firstOption.length > 0) {
                deptSelect.val(firstOption.val());
            }
            toggleView();
            search();
        });

        function toggleView() {
            var mode = $("#viewMode").val();
            if (mode === 'month') {
                $("#monthInput").show();
                $("#dayInput").hide();
                $("#readStatusArea").hide();
                $("#tableHead").html('<tr><th style="width: 40%;">检查项目</th><th>异常记录</th></tr>');
            } else {
                $("#monthInput").hide();
                $("#dayInput").show();
                $("#readStatusArea").show();
                $("#tableHead").html('<tr><th style="width: 40%;">类别</th><th>详细记录</th></tr>');
            }
            search();
        }
        function search() {
            var mode = $("#viewMode").val();
            var deptId;
            var deptId = $("#deptSelect").val();
            console.error("当前选中的部门ID:", deptId); 
            if (mode === 'month') {
                loadMonthSummary(deptId);
            } else {
                loadDaySummary(deptId);
            }
        }

        function loadMonthSummary(deptId) {
            var month = $("#month").val();
            if (!month) { alert("请选择月份"); return; }
            var url = ctx + "sixcheck/record/summary/data?month=" + encodeURIComponent(month);
            if (deptId) {
                url += "&deptId=" + encodeURIComponent(deptId);
            }
            $.get(url, function (res) {
                if (res.code != 0) { alert("查询失败"); return; }
                var data = res.data;
                var html = '';
                if (data.length === 0) {
                    html = '<tr><td colspan="2" class="text-center" style="color:#999;">当月无异常记录</td></tr>';
                } else {
                    for (var i = 0; i < data.length; i++) {
                        var item = data[i];
                        html += '<tr>';
                        html += '<td>' + item.itemName + '</td>';
                        var details = item.details;
                        var contentHtml = '';
                        for (var j = 0; j < details.length; j++) {
                            var d = details[j];
                            var recordStr = d.content + '  值班领导：' + d.leader + '，' + d.date + '，' + d.shift;
                            contentHtml += '<div style="margin-bottom:4px;padding-bottom:4px;border-bottom:1px dashed #eee;">' + recordStr + '</div>';
                        }
                        html += '<td>' + contentHtml + '</td>';
                        html += '</tr>';
                    }
                }
                $("#summaryBody").html(html);
                $("#summaryTable").show();
            });
        }

        function loadDaySummary(deptId) {
            var day = $("#day").val();
            if (!day) { alert("请选择日期"); return; }
            var url = ctx + "sixcheck/record/dailySummary?checkDate=" + encodeURIComponent(day);
            if (deptId) {
                url += "&deptId=" + encodeURIComponent(deptId);
            }
            $.get(url, function (res) {
                if (res.code != 0) { alert("查询失败"); return; }
                var data = res.data;
                var html = '';
                if (data.length === 0) {
                    html = '<tr><td colspan="2" class="text-center" style="color:#999;">当日无记录</td></tr>';
                } else {
                    for (var i = 0; i < data.length; i++) {
                        var item = data[i];
                        html += '<tr>';
                        html += '<td>' + item.itemName + '</td>';
                        var details = item.details;
                        var contentHtml = '';
                        // 如果只有一条记录且内容为“正常”
                        if (details.length === 1 && details[0].content === '正常') {
                            contentHtml = '<span style="color:#5cb85c;">正常</span>';
                        } else {
                            for (var j = 0; j < details.length; j++) {
                                var d = details[j];
                                var recordStr = d.content + '（' + d.shift + '，值班领导-' + d.leader + ')';
                                // console.log("content " +);
                                contentHtml += '<div style="margin-bottom:4px;padding-bottom:4px;border-bottom:1px dashed #eee;">' + recordStr + '</div>';
                            }
                        }
                        html += '<td>' + contentHtml + '</td>';
                        html += '</tr>';
                    }
                }
                $("#summaryBody").html(html);
                $("#summaryTable").show();
                loadReadStatus(day, deptId);
            });
        }
        // ========== 阅读记录相关函数 ==========

        /**
         * 加载某天的日梳理阅读状态
         */
        function loadReadStatus(checkDate, deptId) {
            var url = ctx + "sixcheck/record/read/status?checkDate=" + encodeURIComponent(checkDate);
            if (deptId) url += "&deptId=" + deptId;
            $.get(url, function (res) {
                if (res.code === 0) {
                    var logs = res.data || [];
                    var container = $("#readStatusContainer");
                    if (logs.length === 0) {
                        container.html('<span style="color:#999;">暂无领导阅读</span>');
                    } else {
                        var html = '';
                        logs.forEach(function (log, index) {
                            if (index > 0) html += '、';
                            html += '<span style="color:#337ab7;">' + log.readerName + '</span>';
                            html += ' <span style="color:#999;font-size:12px;">(' + formatTime(log.readTime) + ')</span>';
                        });
                        container.html(html);
                    }
                }
            });
        }

        /**
         * 标记当前用户已阅读
         */
        function markAsRead() {
            var day = $("#day").val();
            if (!day) { alert("请选择日期"); return; }
            var deptId = !isAdmin ? currentDeptId : $("#deptSelect").val();

            $.post(ctx + "sixcheck/record/read/mark", { checkDate: day, deptId: deptId }, function (res) {
                if (res.code === 0) {
                    alert("标记已读成功");
                    loadReadStatus(day, deptId);
                } else {
                    alert("标记失败：" + res.msg);
                }
            });
        }

        /**
         * 格式化时间
         */
        function formatTime(timeStr) {
            if (!timeStr) return '';
            var d = new Date(timeStr);
            var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
                ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }
    </script>
</body>

</html>
