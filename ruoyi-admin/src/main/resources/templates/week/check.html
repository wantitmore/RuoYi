<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:include="include :: header('填表检查')" />
    <style>
        .status-badge {
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-filled {
            background: #d4edda;
            color: #155724;
        }

        .status-partial {
            background: #fff3cd;
            color: #856404;
        }

        .status-empty {
            background: #f8d7da;
            color: #721c24;
        }

        .clickable {
            cursor: pointer;
            color: #1890ff;
        }

        .clickable:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body class="gray-bg">
    <div class="wrapper wrapper-content animated fadeInRight">
        <div class="row">
            <div class="col-sm-12">
                <div class="ibox">
                    <div class="ibox-title">
                        <h5>周检查填表情况</h5>
                    </div>
                    <div class="ibox-content">
                        <div class="form-horizontal">
                            <div class="form-group">
                                <label class="col-sm-1 control-label">检查周：</label>
                                <div class="col-sm-2">
                                    <input type="week" id="weekPicker" class="form-control" />
                                </div>
                                <label class="col-sm-1 control-label">部门：</label>
                                <div class="col-sm-2">
                                    <select id="deptSelect" class="form-control">
                                        <option value="">全部部门</option>
                                        <option th:each="dept : ${depts}" th:value="${dept.deptId}"
                                            th:text="${dept.deptName}"></option>
                                    </select>
                                </div>
                                <div class="col-sm-6">
                                    <button class="btn btn-primary" onclick="loadSummary()">
                                        <i class="fa fa-search"></i> 查询
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="table-responsive" style="display:none;" id="tableWrapper">
                            <table class="table table-bordered table-hover">
                                <thead>
                                    <tr>
                                        <th>部门</th>
                                        <th>分区领导</th>
                                        <!-- <th>应填人数</th>
                                        <th>已填人数</th> -->
                                        <th>状态</th>
                                        <th>填表时间</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:include="include :: footer"></div>

    <script th:inline="javascript">
        var ctx = [[@{/}]];

        $(function () {
            var now = new Date();
            var year = now.getFullYear();
            var month = now.getMonth() + 1;
            var day = now.getDate();
            var dayOfWeek = now.getDay() || 7;
            var mondayOffset = dayOfWeek - 1;
            var monday = new Date(year, month - 1, day - mondayOffset);
            var y = monday.getFullYear();
            var m = String(monday.getMonth() + 1).padStart(2, '0');
            var d = String(monday.getDate()).padStart(2, '0');
            $('#weekPicker').val(y + '-W' + getWeekNumber(monday));
            loadSummary();
        });

        function getWeekNumber(date) {
            var d = new Date(date);
            d.setHours(0, 0, 0, 0);
            var day = d.getDay() || 7;
            d.setDate(d.getDate() - day + 4);
            var yearStart = new Date(d.getFullYear(), 0, 1);
            var weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            return String(weekNo).padStart(2, '0');
        }

        function loadSummary() {
            var weekVal = $("#weekPicker").val();
            if (!weekVal) { alert("请选择检查周"); return; }
            var deptId = $("#deptSelect").val();

            $.get(ctx + "week/summary", { week: weekVal, deptId: deptId }, function (res) {
                if (res.code != 0) { alert("加载失败: " + res.msg); return; }
                var rows = res.data;
                var html = '';
                if (rows.length === 0) {
                    html = '<tr><td colspan="7" style="text-align:center;color:#bbb;">暂无数据</td></tr>';
                } else {
                    $.each(rows, function (i, row) {
                        var statusMap = {
                            '已填完': { label: '✅已填完', cls: 'status-filled' },
                            '已填写': { label: '✅已填写', cls: 'status-filled' },  // 新增
                            '部分填写': { label: '⏳已填写', cls: 'status-partial' },
                            '未填写': { label: '❌未填写', cls: 'status-empty' }
                        };
                        var info = statusMap[row.status] || statusMap['未填写'];
                        html += '<tr>';
                        html += '<td>' + row.deptName + '</td>';
                        html += '<td>' + row.leaderName + '</td>';
                        // html += '<td>' + row.totalCount + '</td>';
                        // html += '<td>' + row.filledCount + '</td>';
                        html += '<td><span class="status-badge ' + info.cls + '">' + info.label + '</span></td>';
                        html += '<td>' + (row.fillTime || '-') + '</td>';
                        // 使用 loginName + week + deptId 查看详情
                        if (row.filledCount > 0) {
                            html += '<td><a href="javascript:void(0)" onclick="viewDetail(\'' + row.loginName + '\', \'' + row.week + '\', ' + row.deptId + ')">查看详情</a></td>';
                        } else {
                            html += '<td><span style="color:#bbb;">-</span></td>';
                        }
                        html += '</tr>';
                    });
                }
                $("#tableBody").html(html);
                $("#tableWrapper").show();
            });
        }

        function viewDetail(loginName, week, deptId) {
            layer.open({
                type: 2,
                title: '周检查详情',
                area: ['90%', '85%'],
                content: ctx + 'week/detailPage?loginName=' + loginName + '&week=' + week + '&deptId=' + deptId,
                btn: ['关闭']
            });
        }

    </script>
</body>

</html>
