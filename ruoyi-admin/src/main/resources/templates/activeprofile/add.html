<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head th:include="include :: header('新增罪犯档案')"></head>

<body>
    <div class="wrapper wrapper-content animated fadeInRight">
        <div class="ibox">
            <div class="ibox-content">
                <form id="addForm" class="form-horizontal">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">囚号：</label>
                        <div class="col-sm-8">
                            <input type="text" id="bh" class="form-control" placeholder="必填，唯一">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-3 control-label">姓名：</label>
                        <div class="col-sm-8">
                            <input type="text" id="xm" class="form-control" placeholder="必填">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-3 control-label">部门：</label>
                        <div class="col-sm-8">
                            <select id="deptId" class="form-control">
                                <option th:each="d : ${depts}" th:value="${d.deptId}" th:text="${d.deptName}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-3 control-label">归属人：</label>
                        <div class="col-sm-8">
                            <select id="ownerId" class="form-control">
                                <option value="">（部门公共）</option>
                                <option th:each="u : ${users}" th:value="${u.userId}" th:text="${u.userName}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="col-sm-offset-3 col-sm-8">
                            <button type="button" class="btn btn-primary" onclick="submitAdd()">
                                <i class="fa fa-save"></i> 保存
                            </button>
                            <button type="button" class="btn btn-default" onclick="closeLayer()">取消</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div th:include="include :: footer"></div>
    <script th:inline="javascript">
        var ctx = [[@{/}]];

        function submitAdd() {
            var bh = $('#bh').val().trim();
            var xm = $('#xm').val().trim();
            var deptId = $('#deptId').val();
            var ownerId = $('#ownerId').val();

            if (!bh) { layer.msg('请填写囚号'); return; }
            if (!xm) { layer.msg('请填写姓名'); return; }

            $.ajax({
                url: ctx + 'biz/activeProfile/add',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    bh: bh,
                    xm: xm,
                    deptId: deptId ? parseInt(deptId) : null,
                    ownerId: ownerId ? parseInt(ownerId) : null,
                    dataJson: '{}',
                    rawJson: '{}',
                    dataSource: 'manual'
                }),
                success: function (res) {
                    if (res.code === 0) {
                        parent.layer.msg('新增成功');
                        parent.$('#dataTable').bootstrapTable('refresh');
                        closeLayer();
                    } else {
                        layer.msg(res.msg || '新增失败');
                    }
                },
                error: function () {
                    layer.msg('请求失败');
                }
            });
        }

        function closeLayer() {
            var index = parent.layer.getFrameIndex(window.name);
            parent.layer.close(index);
        }
    </script>
</body>

</html>
