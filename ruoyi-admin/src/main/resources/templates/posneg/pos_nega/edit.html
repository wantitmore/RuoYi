<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:include="include :: header('修改正负面清单')" />
</head>

<body class="gray-bg">
    <div class="wrapper wrapper-content animated fadeInRight">
        <div class="row">
            <div class="col-sm-12">
                <div class="ibox float-e-margins">
                    <div class="ibox-title">
                        <h5>修改正负面清单</h5>
                    </div>
                    <div class="ibox-content">
                        <form class="form-horizontal" id="form-positive-negative-edit">
                            <input type="hidden" name="id" th:value="${positiveNegative.id}" />

                            <!-- 人员选择 -->
                            <div class="form-group">
                                <label class="col-sm-3 control-label">姓名：</label>
                                <div class="col-sm-8">
                                    <select name="userId" class="form-control" required>
                                        <option value="">请选择人员</option>
                                        <option th:each="user : ${users}" th:value="${user.userId}"
                                            th:text="${user.userName}"
                                            th:selected="${user.userId == positiveNegative.userId}"></option>
                                    </select>
                                </div>
                            </div>

                            <!-- 类别 -->
                            <div class="form-group">
                                <label class="col-sm-3 control-label">类别：</label>
                                <div class="col-sm-8">
                                    <select name="category" class="form-control" required>
                                        <option value="">请选择类别</option>
                                        <option value="正面" th:selected="${positiveNegative.category == '正面'}">正面
                                        </option>
                                        <option value="负面" th:selected="${positiveNegative.category == '负面'}">负面
                                        </option>
                                    </select>
                                </div>
                            </div>

                            <!-- 情形 -->
                            <div class="form-group">
                                <label class="col-sm-3 control-label">情形：</label>
                                <div class="col-sm-8">
                                    <textarea name="situation" class="form-control" rows="3"
                                        th:text="${positiveNegative.situation}" placeholder="请输入情形描述"></textarea>
                                </div>
                            </div>

                            <!-- 结果运用建议 -->
                            <div class="form-group">
                                <label class="col-sm-3 control-label">结果运用建议：</label>
                                <div class="col-sm-8">
                                    <textarea name="suggestion" class="form-control" rows="3"
                                        th:text="${positiveNegative.suggestion}" placeholder="请输入结果运用建议"></textarea>
                                </div>
                            </div>

                            <!-- 次数 -->
                            <div class="form-group">
                                <label class="col-sm-3 control-label">次数：</label>
                                <div class="col-sm-8">
                                    <input type="number" name="count" class="form-control"
                                        th:value="${positiveNegative.count}" min="1" required />
                                </div>
                            </div>

                            <!-- 月份 -->
                            <div class="form-group">
                                <label class="col-sm-3 control-label">月份：</label>
                                <div class="col-sm-8">
                                    <input type="month" name="batchNo" class="form-control"
                                        th:value="${positiveNegative.batchNo}" required />
                                </div>
                            </div>

                            <!-- 按钮 -->
                            <div class="form-group">
                                <div class="col-sm-offset-3 col-sm-8">
                                    <button type="submit" class="btn btn-primary">保存</button>
                                    <button type="button" class="btn btn-default" onclick="$.modal.close()">取消</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = "/posneg/pos_nega";

        $(function () {
            $("#form-positive-negative-edit").validate({
                rules: {
                    userId: { required: true },
                    category: { required: true },
                    batchNo: { required: true }
                },
                submitHandler: function (form) {
                    var formData = $(form).serialize();
                    $.ajax({
                        url: prefix + "/edit",
                        type: "POST",
                        data: formData,
                        success: function (res) {
                            if (res.code == 0) {
                                $.modal.close();
                                $.table.refresh();
                            } else {
                                alert("保存失败：" + res.msg);
                            }
                        },
                        error: function () {
                            alert("保存失败，请检查网络");
                        }
                    });
                }
            });
        });
    </script>
</body>

</html>
