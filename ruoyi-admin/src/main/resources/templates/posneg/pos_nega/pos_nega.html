<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:include="include :: header('正负面清单管理')" />
</head>

<body class="gray-bg">
    <div class="wrapper wrapper-content animated fadeInRight">
        <div class="row">
            <div class="col-sm-12">
                <div class="ibox float-e-margins">
                    <div class="ibox-title">
                        <h5>正负面清单管理</h5>
                    </div>
                    <div class="ibox-content">
                        <div class="row">
                            <div class="col-sm-12" style="margin-bottom: 10px;">
                                <label>月份：</label>
                                <input type="month" id="batchNo"
                                    style="width: 150px; display: inline-block; height: 30px;" />
                                <label style="margin-left: 10px;">类别：</label>
                                <select id="categorySelect" style="width: 100px; display: inline-block; height: 30px;">
                                    <option value="">全部</option>
                                    <option value="正面">正面</option>
                                    <option value="负面">负面</option>
                                </select>
                                <button type="button" class="btn btn-primary" onclick="doSearch()">
                                    <i class="fa fa-search"></i> 查询
                                </button>
                                <div class="pull-right">
                                    <button type="button" class="btn btn-success" onclick="$.operate.add()">
                                        <i class="fa fa-plus"></i> 新增
                                    </button>
                                    <button type="button" class="btn btn-danger" onclick="batchDelete()">删除</button>
                                </div>
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table id="bootstrap-table" class="table table-bordered table-hover"></table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = "/posneg/pos_nega";
        var canEdit = [[${ canEdit }]];
        var canRemove = [[${ canRemove }]];

        $(function () {
            var now = new Date();
            var month = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2);
            $("#batchNo").val(month);

            // 1. 初始化表格，不立即查询，查询参数由 queryParams 动态获取
            $.table.init({
                url: prefix + "/list",
                modalName: "正负面清单",
                uniqueId: "id",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                modalOpts: {
                    buttons: false
                },
                queryParams: function (params) {
                    params.batchNo = $("#batchNo").val();
                    params.category = $("#categorySelect").val();
                    return params;
                },
                columns: [
                    { checkbox: true },
                    { field: 'id', title: '序号', visible: false },
                    { field: 'userName', title: '姓名' },
                    { field: 'category', title: '类别' },
                    { field: 'situation', title: '情形' },
                    { field: 'suggestion', title: '结果运用建议' },
                    { field: 'count', title: '次数' },
                    {
                        title: '操作',
                        align: 'center',
                        formatter: function (value, row, index) {
                            var actions = [];
                            if (canEdit && row.id) {
                                actions.push('<a class="btn btn-success btn-xs" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                                actions.push('<a class="btn btn-danger btn-xs" href="javascript:void(0)" onclick="deleteOne(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');
                            }
                            return actions.join('');
                        }
                    }
                ]
            });

            // 2. 首次加载自动查询
            $.table.search();
        });

        // 批量删除选中的记录
        function batchDelete() {
            var rows = $("#bootstrap-table").bootstrapTable('getSelections');   // 获取表格选中的行
            if (rows.length === 0) {
                alert("请至少选择一条记录");
                return;
            }
            var ids = rows.map(function (row) { return row.id; }).join(",");
            if (confirm("确定要删除选中的 " + rows.length + " 条记录吗？")) {
                $.ajax({
                    url: prefix + "/remove",
                    type: "POST",
                    data: { ids: ids },
                    success: function (res) {
                        if (res.code == 0) {
                            $.table.refresh();
                        } else {
                            alert("删除失败：" + res.msg);
                        }
                    },
                    error: function () {
                        alert("删除失败，请检查网络");
                    }
                });
            }
        }

        // 删除单条记录
        function deleteOne(id) {
            if (confirm("确定要删除该记录吗？")) {
                $.ajax({
                    url: prefix + "/remove",
                    type: "POST",
                    data: { ids: id },
                    success: function (res) {
                        if (res.code == 0) {
                            $.table.refresh();
                        } else {
                            alert("删除失败：" + res.msg);
                        }
                    },
                    error: function () {
                        alert("删除失败，请检查网络");
                    }
                });
            }
        }

        // 查询按钮调用此函数
        function doSearch() {
            $.table.search({
                batchNo: $("#batchNo").val(),
                category: $("#categorySelect").val()
            });
        }   
    </script>
</body>

</html>
