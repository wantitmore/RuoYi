<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="main">
    <style>
        .ibox-content {
            position: relative;
            padding: 0 !important;
            overflow: hidden;
            /* 防止溢出滚动条 */
            min-height: 500px;
            /* 保证至少有一定高度 */
        }

        .welcome-area {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('/img/home_bg.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: flex-start;
            /* 文字在底部 */
            justify-content: center;
            box-sizing: border-box;
        }

        .welcome-card {
            width: 100%;
            text-align: center;
            /* padding: 20px 40px; */
            border-radius: 8px;
            margin-top: -30px;
        }

        .welcome-card h3 {
            font-size: 56px;
            font-weight: 300;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .welcome-card p {
            font-size: 18px;
            opacity: 0.8;
        }
    </style>
    <div class="welcome-area">
        <div class="welcome-card">
            <h3>两个职责考核管理系统</h3>
        </div>
    </div>
</th:block>

</html>
