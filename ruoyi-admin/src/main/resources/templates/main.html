    <style>
        .welcome-area {
            /* linear-gradient(135deg, #667eea 0%, #764ba2 100%)  */
            background: url('/img/home_bg.jpg') no-repeat center center;
            min-height: 500px;
            border-radius: 4px;
            display: flex;
            justify-content: center;

        .welcome-card {

            opacity: 0.8;
        }

    <div class="welcome-area">
        <div class="welcome-card">
