<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head th:include="include :: header('视频回放录入')">
    <link th:href="@{/css/style.css}" rel="stylesheet" />
</head>

<body class="gray-bg">
    <div class="wrapper wrapper-content animated fadeInRight">
        <div class="row">
            <div class="col-sm-12">
                <div class="ibox">
                    <div class="ibox-title">
                        <h5>视频回放录入</h5>
                    </div>
                    <div th:if="${canEdit}" class="form-group"
                        style="margin-top:15px;padding:10px;border:1px solid #ddd;border-radius:4px;background:#f9f9f9;">
                        <label class="control-label" style="width:80px;">撤销扣分：</label>
                        <div style="display:inline-block;width:200px;">
                            <input type="number" id="cancelDetailId" class="form-control" placeholder="输入扣分明细ID" />
                        </div>
                        <button class="btn btn-danger" onclick="cancelByDetail()">
                            <i class="fa fa-undo"></i> 撤销
                        </button>
                        <span style="margin-left:10px;color:#999;font-size:12px;">提示：点击上方ID标签可复制</span>
                    </div>
                    <div class="ibox-content">
                        <div class="form-horizontal">
                            <div class="form-group">
                                <label class="col-sm-1 control-label">月份：</label>
                                <div class="col-sm-2">
                                    <input type="month" id="batchNo" class="form-control" />
                                </div>
                                <div class="col-sm-2">
                                    <button class="btn btn-primary" onclick="loadData()">
                                        <i class="fa fa-search"></i> 加载/刷新
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="table-responsive" style="display:none;" id="tableWrapper">
                            <table class="table table-bordered">
                                <thead>
                                    <tr>
                                        <th style="width: 60px;">序号</th>
                                        <th style="width: 15%;">倒查位置</th>
                                        <th style="width: 20%;">具体内容</th>
                                        <th style="width: 70%;">回放情况</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody"></tbody>
                            </table>
                            <div class="text-center" style="margin-top:20px;">
                                <button class="btn btn-success" id="saveBtn" onclick="saveData()" style="display:none;">
                                    <i class="fa fa-save"></i> 保存
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:include="include :: footer"></div>
    <script th:inline="javascript">
        var ctx = [[@{/}]];
        var canEdit = [[${ canEdit }]];
        var deptUsers = [];
        var deptItems = [];
        var canDeduct = [[${ canEdit }]];

        $(function () {
            var now = new Date();
            var month = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2);
            $("#batchNo").val(month);
            loadData();
            $("#batchNo").on('change', function () {
                loadData();
            });
        });

        function loadData() {
            var batchNo = $("#batchNo").val();
            if (!batchNo) { alert("请选择月份"); return; }
            $.get(ctx + "video/record/load", { batchNo: batchNo }, function (res) {
                if (res.code != 0) { alert("加载失败"); return; }
                var items = res.data.items;
                var records = res.data.records;
                var kpiScoreMap = res.data.kpiScoreMap || {};
                var html = '';
                var readonlyAttr = canEdit ? '' : 'readonly';
                var detailInfoList = res.data.detailInfoList || [];
                // 构建扣分明细映射：itemId + deductInfo -> detailId
                var detailMap = {};
                for (var i = 0; i < detailInfoList.length; i++) {
                    var info = detailInfoList[i];
                    console.log("i=" + i + " info.status " + info.status);
                    if (info.status == 1) {
                        var key = info.itemId + '|' + info.deductInfo;
                        detailMap[key] = info.detailId;
                    }
                }
                console.log("detailMap size " + Object.keys(detailMap).length);
                for (var i = 0; i < items.length; i++) {
                    var item = items[i];
                    var recordValue = records[item.id] || '';
                    html += '<tr>';
                    html += '<td>' + (i + 1) + '</td>';
                    html += '<td>' + item.checkPosition + '</td>';
                    html += '<td>' + item.specificContent + '</td>';
                    html += '<td><textarea class="form-control" data-item-id="' + item.id + '" rows="3" ' + readonlyAttr + '>' + recordValue + '</textarea></td>';
                    if (canEdit) {
                        /*                         html += '<td><button class="btn btn-xs btn-warning" ' +
                                                    'onclick="openDeductModal(\'' + item.name + '\', \'' + ($("#dutyLeader").val() || '') + '\', \'' + item.id + '\')">' +
                                                    '<i class="fa fa-minus-circle"></i> 关联加扣分</button></td>'; */
                        html += '<td><button class="btn btn-xs btn-warning" onclick="openDeductModal(\'' + item.name + '\', ' + item.id + ')">关联加扣分</button></td>';
                    }
                    var deductPattern = /（关联加扣分-[^）]+）/g;
                    var deductMatches = recordValue.match(deductPattern);
                    if (deductMatches && deductMatches.length > 0) {
                        // 显示每条扣分的明细ID
                        var idHtml = '';
                        for (var j = 0; j < deductMatches.length; j++) {
                            var deduct = deductMatches[j];
                            var key = item.id + '|' + deduct;
                            var detailId = detailMap[key] || '';
                            console.log("detailId is " + detailId + ", canEdit is " + canEdit);
                            if (detailId && canEdit) {
                                var displayText = deduct.length > 26 ? deduct.substring(0, 26) + '...' : deduct;
                                idHtml += '<span class="label label-info" style="cursor:pointer; font-size:12px; margin:2px 4px 2px 0; display:inline-block;" title="'
                                    + deduct.replace(/"/g, '&quot;')
                                    + '" onclick="copyText(\'' + detailId + '\')">ID:' + detailId + '</span>';
                            }
                        }
                        html += '<td style="font-size:12px;">' + idHtml + '</td>';
                    } else {
                        html += '<td></td>';
                    }
                    html += '</tr>';
                }
                $("#tableBody").html(html);
                $("#tableWrapper").show();
                if (canEdit) {
                    $("#saveBtn").show();
                }
            });
        }
        function copyText(text) {
            var input = document.createElement('input');
            input.value = text;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            alert('已复制扣分明细ID: ' + text);
        }

        function saveData(silent) {
            var batchNo = $("#batchNo").val();
            if (!batchNo) { alert("请选择月份"); return; }

            var recordList = [];
            $("#tableBody textarea").each(function () {
                var itemId = $(this).data('item-id');
                var value = $(this).val();
                if (value && value.trim() !== '') {
                    recordList.push({
                        itemId: itemId,
                        batchNo: batchNo,
                        playbackStatus: value
                    });
                }
            });
            if (recordList.length === 0) { alert("没有可保存的记录"); return; }

            $.ajax({
                url: ctx + "video/record/save",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(recordList),
                success: function (res) {
                    if (res.code == 0) {
                        if (!silent) {
                            alert("保存成功！");
                        }
                    } else {
                        alert("保存失败：" + res.msg);
                    }
                }
            });
        }
        function cancelByDetail() {
            var detailId = $("#cancelDetailId").val();
            if (!detailId) {
                alert("请输入要撤销的扣分明细ID");
                return;
            }
            if (!confirm("确认撤销 ID=" + detailId + " 的视频回放记录吗？")) {
                return;
            }

            $.ajax({
                url: ctx + "video/record/cancelByDetail",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify({
                    detailId: detailId
                }),
                success: function (res) {
                    if (res.code == 0) {
                        alert("撤销成功！");
                        $("#cancelDetailId").val(""); // 清空输入框
                        loadData(); // 刷新页面
                    } else {
                        alert("撤销失败：" + res.msg);
                    }
                },
                error: function (xhr) {
                    alert("请求失败：" + xhr.status);
                }
            });
        }

        function openDeductModal(checkItemName, videoItemId) {
            var deptId = [[${ currentDeptId }]];
            if (!deptId) {
                alert("无法获取部门信息");
                return;
            }

            window._currentDeductInfo = {
                videoItemId: videoItemId,
                batchNo: $("#batchNo").val(),
                currentValue: $("#tableBody textarea[data-item-id='" + videoItemId + "']").val() || '正常'
            };

            $.when(
                $.get(ctx + "kpi/score/getUsersByDept?deptId=" + deptId),
                $.get(ctx + "kpi/score/getItemsByDept?deptId=" + deptId)
            ).done(function (usersRes, itemsRes) {
                var users = usersRes[0].data || [];
                var items = itemsRes[0].data || [];
                window._deductItems = items; 
                var userOptions = '<option value="">请选择</option>';
                $.each(users, function (i, u) {
                    userOptions += '<option value="' + u.userId + '">' + u.userName + '</option>';
                });

                var categories = [];
                $.each(items, function (i, item) {
                    if (item.category && categories.indexOf(item.category) === -1) {
                        categories.push(item.category);
                    }
                });
                var catOptions = '<option value="">请选择类别</option>';
                $.each(categories, function (i, cat) {
                    catOptions += '<option value="' + cat + '">' + cat + '</option>';
                });

                var contentHtml = '<div style="padding:15px;">' +
                    '<form class="form-horizontal">' +
                    '<div class="form-group"><label class="col-sm-3 control-label">被考核人：</label><div class="col-sm-8"><select id="deductUserId" class="form-control">' + userOptions + '</select></div></div>' +
                    '<div class="form-group"><label class="col-sm-3 control-label">考核类别：</label><div class="col-sm-8"><select id="deductCategory" class="form-control">' + catOptions + '</select></div></div>' +
                    '<div class="form-group"><label class="col-sm-3 control-label">考核项目：</label><div class="col-sm-8"><select id="deductItemId" class="form-control"><option value="">请先选择类别</option></select></div></div>' +
                    '<div class="form-group"><label class="col-sm-3 control-label">分数：</label><div class="col-sm-8"><input type="number" id="deductScore" class="form-control" step="0.5" min="-10" max="10" /></div></div>' +
                    '<div class="form-group"><label class="col-sm-3 control-label">备注：</label><div class="col-sm-8"><textarea id="deductRemark" class="form-control" rows="2"></textarea></div></div>' +
                    '</form></div>';

                layer.open({
                    type: 1,
                    title: '关联加扣分 - ' + checkItemName,
                    shadeClose: false,
                    shade: 0.3,
                    area: ['550px', '400px'],
                    btn: ['确定', '取消'],
                    content: contentHtml,
                    yes: function (index, layero) {
                        var userId = $(layero).find('#deductUserId').val();
                        var itemId = $(layero).find('#deductItemId').val();
                        var score = $(layero).find('#deductScore').val();
                        var remark = $(layero).find('#deductRemark').val();
                        if (!userId || !itemId || !score) {
                            alert("请填写完整信息");
                            return;
                        }
                        var selectedItem = window._deductItems.find(function (it) { return it.id == itemId; });
                        if (selectedItem) {
                            if (selectedItem.category === '正面清单') {
                                // 正面清单：0 ~ 3
                                if (score < 0 || score > 3) {
                                    alert('正面清单只能加0~3分，请重新输入');
                                    return;
                                }
                            } else {
                                // 其他类别：-3 ~ 0
                                if (score < -3 || score > 0) {
                                    alert('该类考核项只能扣分（-3 ~ 0分），不能加分');
                                    return;
                                }
                            }
                        } else {
                            // 如果找不到项目，也做基本范围检查
                            if (score < -3 || score > 3) {
                                alert('分数必须在 -3 到 3 之间');
                                return;
                            }
                        }
                        $.ajax({
                            url: ctx + "kpi/score/videoQuickDeduct",
                            type: "POST",
                            contentType: "application/json",
                            data: JSON.stringify({
                                userId: userId,
                                itemId: itemId,
                                score: parseFloat(score),
                                remark: remark,
                                videoItemId: window._currentDeductInfo.videoItemId,
                                videoDate: window._currentDeductInfo.batchNo,
                                checkDate: window._currentDeductInfo.batchNo + '-01'
                            }),
                            success: function (res) {
                                console.log('完整响应:', res);
                                if (res.code == 0) {
                                    alert("加扣分成功！");
                                    layer.close(index);
                                    // 更新 textarea（如果有 finalValue）
                                    if (res.data && res.data.finalValue) {
                                        var textarea = $('textarea[data-item-id="' + window._currentDeductInfo.videoItemId + '"]');
                                        if (textarea.length > 0) {
                                            textarea.val(res.data.finalValue);
                                        }
                                    }

                                    // 2. 获取 kpiScoreId 并更新 kpiScoreMap（可选）
                                    var kpiScoreId = res.data ? res.data.kpiScoreId : null;
                                    console.log("加扣分成功，kpiScoreId=" + kpiScoreId);

                                    // 3. 不刷新页面，避免丢失未保存内容

                                } else {
                                    alert("操作失败：" + res.msg);
                                }
                            }
                        });
                    },
                    btn2: function (index) {
                        layer.close(index);
                    },
                    success: function (layero, index) {
                        $(layero).find('#deductCategory').on('change', function () {
                            var cat = $(this).val();
                            var itemSelect = $(layero).find('#deductItemId');
                            var html = '<option value="">请选择项目</option>';
                            if (cat) {
                                $.each(items, function (i, item) {
                                    if (item.category === cat) {
                                        html += '<option value="' + item.id + '">' + item.name + ' </option>';
                                    }
                                });
                            }
                            itemSelect.html(html);
                            $(layero).find('#deductScore').val('');
                            $(layero).find('#deductItemId').on('change', function () {
                                var itemId = $(this).val();
                                var scoreInput = $(layero).find('#deductScore');
                                if (itemId) {
                                    var selectedItem = window._deductItems.find(function (it) { return it.id == itemId; });
                                    if (selectedItem) {
                                        if (selectedItem.category === '正面清单') {
                                            scoreInput.attr('min', 0);
                                            scoreInput.attr('max', 3);
                                            scoreInput.attr('placeholder', '只能输入 0 ~ 3 分的加分');
                                        } else {
                                            scoreInput.attr('min', -3);
                                            scoreInput.attr('max', 0);
                                            scoreInput.attr('placeholder', '只能输入 -3 ~ 0 分的扣分');
                                        }
                                        // 清空之前输入的分数，避免超出范围
                                        scoreInput.val('');
                                    }
                                } else {
                                    // 未选择项目时恢复默认范围
                                    scoreInput.attr('min', -3);
                                    scoreInput.attr('max', 3);
                                    scoreInput.attr('placeholder', '请先选择考核项目');
                                    scoreInput.val('');
                                }
                            });
                        });
                    }
                });
            });
        }

        // 撤销关联扣分
    </script>
</body>

</html>
